<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Market Pulse analytics dashboard">
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mp-area" x1="0" y1="150" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mp-line" x1="60" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#mp-bg)"/>

  <!-- subtle grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.5">
    <line x1="60" y1="90" x2="600" y2="90"/>
    <line x1="60" y1="150" x2="600" y2="150"/>
    <line x1="60" y1="210" x2="600" y2="210"/>
    <line x1="60" y1="270" x2="600" y2="270"/>
    <line x1="60" y1="330" x2="600" y2="330"/>
  </g>

  <!-- header -->
  <circle cx="44" cy="44" r="6" fill="#06b6d4"/>
  <text x="60" y="49" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">MARKET&#160;PULSE</text>
  <text x="60" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="1">REAL-TIME STREAMING &#8226; ANOMALY DETECTION</text>

  <!-- area under main series -->
  <path d="M60 300 L110 270 L160 285 L210 230 L260 250 L310 190 L360 210 L410 160 L460 185 L510 135 L560 165 L600 130 L600 330 L60 330 Z" fill="url(#mp-area)"/>

  <!-- main price line -->
  <path d="M60 300 L110 270 L160 285 L210 230 L260 250 L310 190 L360 210 L410 160 L460 185 L510 135 L560 165 L600 130" fill="none" stroke="url(#mp-line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- anomaly markers -->
  <g>
    <circle cx="310" cy="190" r="7" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <circle cx="510" cy="135" r="7" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <circle cx="510" cy="135" r="14" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.45"/>
  </g>

  <!-- ticker chips -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600">
    <rect x="60" y="352" width="70" height="26" rx="13" fill="#1e3a8a"/>
    <text x="95" y="369" fill="#bfdbfe" text-anchor="middle">AAPL</text>
    <rect x="140" y="352" width="70" height="26" rx="13" fill="#1e3a8a"/>
    <text x="175" y="369" fill="#bfdbfe" text-anchor="middle">MSFT</text>
    <rect x="220" y="352" width="76" height="26" rx="13" fill="#1e3a8a"/>
    <text x="258" y="369" fill="#bfdbfe" text-anchor="middle">GOOGL</text>
    <rect x="306" y="352" width="66" height="26" rx="13" fill="#1e3a8a"/>
    <text x="339" y="369" fill="#bfdbfe" text-anchor="middle">NVDA</text>
  </g>

  <!-- live badge -->
  <g>
    <rect x="512" y="34" width="88" height="26" rx="13" fill="#052e2b" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="530" cy="47" r="4" fill="#22d3ee"/>
    <text x="542" y="51" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#67e8f9">LIVE</text>
  </g>
</svg>
